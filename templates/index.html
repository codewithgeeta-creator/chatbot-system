window.onload = function(){

addMessage(
translations[currentLanguage].welcome,
"bot"
);

}

function setLanguage(lang){

currentLanguage = lang;

addMessage(
translations[lang].welcome,
"bot"
);

}

function addMessage(message, sender){

let chatbox = document.getElementById("chatbox");

let msg = document.createElement("div");
msg.classList.add("message", sender);

let bubble = document.createElement("div");
bubble.classList.add("bubble");

bubble.innerHTML = makeClickable(message);

msg.appendChild(bubble);
chatbox.appendChild(msg);

chatbox.scrollTop = chatbox.scrollHeight;
}

function makeClickable(text){

const students = [
["Rakshak","rakshak.pdf"],
["Sachin Kumar B","sachin.pdf"],
["Abhilash D R","abhilash.pdf"],
["Sandeep Ashok","sandeep.pdf"],
["Geeta Jagadish Malali","geeta.pdf"],
["Sushma H M","Sushma H M.pdf"],
["Vamshi P R","vamshi.pdf"],
["Bharathi H V","Bharathi.pdf"]
];

students.forEach(s=>{

text = text.replaceAll(

s[0],

`<span class='name' onclick="openOffer('${s[1]}')">${s[0]}</span>`

);

});

return text;
}

function generateReply(msg){

msg = msg.toLowerCase();

if(msg.includes("course"))
return translations[currentLanguage].courses;

if(msg.includes("fee"))
return translations[currentLanguage].fees;

if(msg.includes("admission"))
return translations[currentLanguage].admission;

if(msg.includes("placement"))
return translations[currentLanguage].placement;

if(msg.includes("facilities"))
return translations[currentLanguage].facilities;

return "Please ask queries related to college information.";
}

function sendMessage(){

let input = document.getElementById("text");
let msg = input.value;

if(!msg) return;

addMessage(msg,"user");

input.value = "";

let response = generateReply(msg);

lastResponse = response;

addMessage(response,"bot");
}

function quickSend(text){

document.getElementById("text").value = text;
sendMessage();
}

function handleKey(e){
if(e.key==="Enter") sendMessage();
}

function clearChat(){
document.getElementById("chatbox").innerHTML="";
}

let recognition;

function startVoice(){

if (!("webkitSpeechRecognition" in window)) {
alert("Use Google Chrome");
return;
}

recognition = new webkitSpeechRecognition();
recognition.lang="en-IN";
recognition.start();

recognition.onresult = function(e){

document.getElementById("text").value =
e.results[0][0].transcript;

sendMessage();
};
}

function stopVoice(){

if(recognition){
recognition.stop();
}

window.speechSynthesis.cancel();
}

function speakText(){

if(!lastResponse) return;

window.speechSynthesis.cancel();

let speech = new SpeechSynthesisUtterance();
speech.text = lastResponse;
speech.lang = "en-IN";

window.speechSynthesis.speak(speech);
}

function openOffer(file){

document.getElementById("popup").style.display="block";

document.getElementById("frame").src="/static/offers/"+file;
}

function closePopup(){
document.getElementById("popup").style.display="none";
}

function downloadOffer(){

let file = document.getElementById("frame").src;

let a = document.createElement("a");
a.href = file;
a.download = "OfferLetter.pdf";
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
}
